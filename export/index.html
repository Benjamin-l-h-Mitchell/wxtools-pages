<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    const path = window.location.pathname;
    const match = path.match(/^/export/(.+)$/);

    if (match) {
      // Construct the destination URL with the correct protocol (radarscope://)
      const destination = radarscope:/palette?url=${encodeURIComponent(match[1])};

      // Redirecting using window.location.replace()
      window.location.replace(destination);
    } else {
      // Fallback message if no match is found
      document.body.innerText = "Invalid URL.";
    }
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
